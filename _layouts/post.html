---
layout: default
---
<article>
      <div class="post-head">
        <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time> · {{ content | number_of_words | divided_by: 220 | plus: 1 }} min read</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
      </div>
      <div class="prose">
{{ content }}
      </div>
      <p><a class="back" href="/writing/">All writing</a></p>
    </article>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","author":{"@type":"Person","name":"Cody Alexander","url":"https://itsmecody.com/"},"mainEntityOfPage":"{{ page.url | absolute_url }}","image":"{{ page.image | default: '/og.png' | absolute_url }}"}
</script>
