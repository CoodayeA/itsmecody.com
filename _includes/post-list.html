<ul class="posts">
        {%- for post in include.posts limit: include.limit %}
        <li><a href="{{ post.url }}">
          <span class="t">{{ post.title }}</span>
          <span class="d">{{ post.date | date: "%b %Y" }}</span>
          <span class="x">{{ post.description | default: post.excerpt | strip_html | strip_newlines | truncate: 180 }}</span>
        </a></li>
        {%- endfor %}
      </ul>
